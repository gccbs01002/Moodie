<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>興奮</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/swiper/swiper-bundle.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="page-excitement">
    <div class="phone-frame">
      <div class="phone-frame-relative">
        <div class="gradient-overlay"></div>
        <!-- 🔽 固定在最上方的 Status Bar -->
        <img
          src="/assets/images/AppFrame/Status Bar.svg"
          alt="Status Bar"
          class="status-bar"
        />
        <div class="phone-screen phone-screen-after ex-noroll">
          <div class="main-page">
            <!-- 整頁容器 -->
            <div class="page align-items-start">
              <!-- 固定背景層（整頁鋪滿） -->
              <div class="bg-fixed" aria-hidden="true"></div>

              <!-- 內容層（可捲動） -->
              <div class="content container py-2 text-center text-white">
                <h2 class="fw-bold mb-3">
                  準備好看劇了嗎？<br />選擇你的今天的主角！
                </h2>

                <div class="main-hero mb-4">
                  <img
                    src="/assets/images/page-initial/Surprise.svg"
                    alt="wizard star"
                    class="img-fluid hero-img mx-auto"
                  />
                </div>

                <h3 class="fw-bold mb-2">興奮</h3>

                <p class="lead mb-5 fs-10">
                  興奮是一場全面引爆的盛宴<br />
                  <span class="fw-bold"
                    >「喜劇的笑點、歌舞的律動、冒險的衝擊、<br />
                    奇幻的想像與熱血的沸騰」</span
                  >，帶你嗨到忘我！
                </p>

                <section>
                  <div class="container">
                    <div class="row">
                      <div class="col-12 btn-group-wide">
                        <a
                          href="https://gccbs01002.github.io/Moodie/initial.html"
                          class="btn btn-secondary btn-glass fs-12"
                          role="button"
                        >
                          返回情緒選單
                        </a>
                        <a
                          href="https://gccbs01002.github.io/Moodie/recommend/recom-excit.html"
                          class="btn btn-primary btn-gradient fs-12"
                          role="button"
                        >
                          前往影片清單
                        </a>
                      </div>
                    </div>
                  </div>
                </section>
              </div>
            </div>
          </div>
          
        </div>
        <div class="bottom-glass-nav excited-nav ">
          <nav class="new-glass-nav glass-nav-fixed" aria-label="主選單">
            <div class="d-flex py-12">
              <a
                class="new-glass-nav__item me-1"
                href="https://gccbs01002.github.io/Moodie/"
              >
                <img src="/assets/images/Icon/Home(Gray).svg" alt="首頁" />
                <p class="glass-nav-text">首頁</p>
              </a>
              <a
                class="new-glass-nav__item me-1 is-active"
                href="https://gccbs01002.github.io/Moodie/roles/excitement.html"
              >
                <img src="/assets/images/Icon/Heart(Gray).svg" alt="情緒片單" />
                <p class="glass-nav-text Text-active ">情緒片單</p>
              </a>
              <a
                class="new-glass-nav__item me-1"
                href="https://gccbs01002.github.io/Moodie/search/search-placeholder.html"
              >
                <img
                  src="/assets/images/Icon/Search(gray).svg"
                  alt="搜尋"
               
                />
                <p class="glass-nav-text">搜尋</p>
              </a>
              <a
                class="new-glass-nav__item me-1"
                href="https://gccbs01002.github.io/Moodie/mine-account/playlist.html"
              >
                <img
                  src="/assets/images/Icon/Bookmark(Gray).svg"
                  alt="個人片單"
                />
                <p class="glass-nav-text">個人片單</p>
              </a>
              <a
                class="new-glass-nav__item"
                href="https://gccbs01002.github.io/Moodie/mine-account/account.html"
              >
                <img src="/assets/images/Icon/User(Gray).svg" alt="帳戶" />
                <p class="glass-nav-text">帳戶</p>
              </a>
            </div>
          </nav>
        </div>

        <footer class="Home-Indicator"></footer>
      </div>
      <img
        src="/assets/images/AppFrame/iPhone_15_Pro_Black_Titanium_Mock_Up(O).png"
        alt=""
        class="phone-overlay"
      />
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
