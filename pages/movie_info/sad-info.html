<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>影片互動與資訊頁-悲傷</title>
  </head>
  <body>
    
    <div class="phone-frame">
        <div class="phone-frame-relative">
            <div class="StatusBar"></div>
                <div class="phone-screen">   
            
                <!-- <%- include('./layout/header'); -%>? -->

                <!-- Content -->
                <main>
                    <div class="bg-color">
                        <!-- Banner -->
                        <div class="position-relative banner-border-radious">
                            <div class="banner">
                                <img src="/assets/images/page-emotion-recommendation/movie-Sad-1.jpg" alt="日麗 (Aftersun)" class="img-fluid">
                            </div>
                            <div>
                                <a href="https://gccbs01002.github.io/Moodie/recommend/recom-excit.html"><button type="button" class="close-button" width="48px"><img src="/assets/images/Icon/Close.svg" alt="close-button" class="position-absolute top-50 start-50 translate-middle"></button></a>
                            </div>
                            <div>
                                <a class="play-button position-absolute top-50 start-50 translate-middle" href="https://gccbs01002.github.io/Moodie/movie_play/barbie-play.html"><img src="/assets/images/Icon/Play.svg" alt="play-button" class="position-absolute top-50 start-50 translate-middle"></a>
                            </div>
                            <span class="emotion-tag emotion-tag-Sad text-sm">78%悲傷</span>
                        </div>

                        <div class="pt-2 pb-40">
                            <div class="container">
                                <!-- Movie-Intro -->
                                <section class="d-flex">
                                    <div class="d-flex align-items-center mb-2">    
                                        <span class="status-tag status-tag-Sad text-xs text-white me-2">6+</span>
                                        <span class="text-xs text-white me-2">95%契合</span>
                                        <div class="d-flex align-items-center">
                                            <button type="button">
                                                <img src="/assets/images/Icon/Star.svg" width="16px" alt="Star-Icon">
                                            </button>
                                            <span class="text-xs text-white ml-2">7.1</span>
                                        </div>
                                    </div>
                                    <div class="ms-auto">
                                        <button type="button"><img src="/assets/images/Icon/Download.svg" alt="Download-Icon" class="p-12"></button>
                                        <button type="button"><img src="/assets/images/Icon/Plus.svg" alt="Plus-Icon" class="p-12 mx-2"></button>
                                        <button type="button"><img src="/assets/images/Icon/Send.svg" alt="Send-Icon" class="p-12"></button>
                                    </div>
                                </section>
                                
                                <section>
                                    <h1 class="h4 text-white mb-2">日麗 (Aftersun)</h1>
                                    <div class="text-xs text-neutral-300 mb-2">    
                                        <span class="bg-tag px-2">2022</span>
                                        <span class="mx-2">102分鐘</span>
                                        <span>親密寫實．視覺詩意</span>
                                    </div>
                                    <p class="text-xs text-white mb-2">充滿好奇心的11歲女孩蘇菲和她年輕的單身父親卡倫，一起前往碧海藍天的土耳其渡假。即將成為青少女的她，珍惜與父親難得的共處時光，那裡發生的每一件小事，更不知不覺刻劃出他們互為磐石的情感。20年後，蘇菲已是當年父親出遊的年紀，她回想起那年夏天的記憶碎片，那位熟悉又陌生的父親，逐漸顯露出她不曾察覺的憂傷......</p>
                                </section>
                            </div> 



                        <!-- 演員與導演資訊 -->
                            <section class="mb-2">   
                                <div class="container">
                                    <h2 class="h5 text-white py-11-5 mb-2">演員與導演資訊</h2>
                                    <div class="mb-2">    
                                        <span class="text-xs text-neutral-300 me-2">導演</span>
                                        <span class="text-xs text-neutral-300">夏洛特威爾斯</span>
                                    </div>
                                </div>
                                
                                <section class="ml-16">
                                    <div class="d-flex mb-2 overflow-auto">
                                        <div class="actor-card text-center">
                                            <a href="#"><img src="/assets/images/page-detail/Sad-1.jpg" class="card-img-top" alt="保羅麥斯卡"></a>
                                            <div>
                                                <a href="#"><h4 class="h5">保羅麥斯卡</h4></a>
                                                <h5 class="h6 text-neutral-300">卡倫</h5>
                                            </div>
                                        </div>
                                    
                                        <div class="actor-card text-center">
                                            <a href="#"><img src="/assets/images/page-detail/Sad-2.jpg" class="card-img-top" alt="法蘭琪柯芮"></a>
                                            <div>
                                                <a href="#"><h4 class="h5">法蘭琪柯芮</h4></a>
                                                <h5 class="h6 text-neutral-300">蘇菲</h5>
                                            </div>
                                        </div>
                                    
                                        <div class="actor-card text-center">
                                            <a href="#"><img src="/assets/images/page-detail/Sad-3.jpg" class="card-img-top" alt="西莉亞羅爾森霍爾"></a>
                                            <div>
                                                <a href="#"><h4 class="h5">西莉亞羅爾森<br>霍爾</h4></a>
                                                <h5 class="h6 text-neutral-300">蘇菲</h5>
                                            </div>
                                        </div>
                                    
                                        <div class="actor-card text-center">
                                            <a href="#"><img src="/assets/images/page-detail/Sad-4.jpg" class="card-img-top" alt="莎莉梅沙姆"></a>
                                            <div>
                                                <a href="#"><h4 class="h5">莎莉梅沙姆</h4></a>
                                                <h5 class="h6 text-neutral-300">貝琳達</h5>
                                            </div>
                                        </div>
                                    </div>
                                </section>
                                
                            </section>

                            <!-- 類似影片 -->
                            <section class="ml-16">    
                                <h2 class="h5 text-white py-11-5 mb-2">類似影片</h2>
                                <div class="d-flex flex-nowrap overflow-auto">
                                    <div class="video-card">
                                        <a href="#"><img src="/assets/images/(new)page-emotion-recommendation/movie-Sad-3.jpg" class="card-img-top" alt="類似影片1"></a>
                                    </div>
                                    
                                    <div class="video-card">
                                        <a href="#"><img src="/assets/images/(new)page-emotion-recommendation/movie-Sad-6.jpg" class="card-img-top" alt="類似影片2"></a>
                                    </div>
                                    
                                    <div class="video-card">
                                        <a href="#"><img src="/assets/images/(new)page-emotion-recommendation/movie-Sad-4.jpg" class="card-img-top" alt="類似影片3"></a>
                                    </div>
                                    
                                    <div class="video-card">
                                        <a href="#"><img src="/assets/images/(new)page-emotion-recommendation/movie-Sad-9.jpg" class="card-img-top" alt="類似影片4"></a>
                                    </div>
                                </div>
                            </section> 
                        </div>

                        <div class="fake-bottom-area mar-t-6">　</div>
                    </div>
                    
                </main>

                <!-- <%- include('./layout/footer'); -%> -->
        
                </div>
            <footer class="Home-Indicator"></footer>
        </div>
        <img src="/assets/images/AppFrame/iPhone_15_Pro_Black_Titanium_Mock_Up(O).png" alt="" class="phone-overlay">
    </div>


    <script type="module" src="/main.js"></script>
  </body>
</html>
